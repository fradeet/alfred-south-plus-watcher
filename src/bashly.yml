name: south-plus-cli
help: Fetch and parse forum threads for Play New ASMR
version: 0.1.0

dependencies:
  - curl
  - htmlq
  - jq

environment_variables:
  - name: SP_BASE_URL
    help: Shared forum base URL (default https://spring-plus.net/)
    default: https://spring-plus.net
  - name: SP_COOKIE_FILE
    help: Netscape-format Cookie file; takes precedence over SP_WINDUSER
  - name: SP_USER_AGENT
    help: Override the default browser User-Agent
  - name: SP_WINDUSER
    help: Value of the eb9e6_winduser login Cookie

flags:
  - long: --verbose
    short: -v
    help: Show diagnostic messages on stderr
    repeatable: true

commands:
  - name: forum
    help: Browse forums
    commands:
      - name: view
        help: View threads in a subforum
        args:
          - name: forum_id
            help: Subforum ID (fid=*)
            required: true
        flags:
          - long: --output-format
            arg: format
            allowed: [alfred-json]
            required: true
