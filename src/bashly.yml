name: play-new-asmr-cli
help: Fetch and parse forum threads for Play New ASMR
version: 0.1.0

environment_variables:
  - name: SOUTH_BASE_URL
    help: Shared forum base URL (default https://spring-plus.net/)

flags:
  - long: --verbose
    short: -v
    help: Show diagnostic messages on stderr
    repeatable: true

commands:
  - name: get-html
    help: Fetch a forum page and output HTML
    dependencies: [curl, htmlq]
    environment_variables:
      - name: SOUTH_WINDUSER
        help: Value of the eb9e6_winduser login Cookie
      - name: SOUTH_COOKIE_FILE
        help: Netscape-format Cookie file; takes precedence over SOUTH_WINDUSER
      - name: SOUTH_USER_AGENT
        help: Override the default browser User-Agent
    flags:
      - long: --fid
        arg: id
        help: Subforum ID
        default: '208'
  - name: parse-thread-list
    help: Read HTML from stdin and output thread titles, dates and types
    dependencies: [htmlq, jq]
    flags:
      - long: --output-format
        arg: format
        help: Output format (alfred_json sets alfredworkflow.arg to URL-tab-title strings; text is tab-separated)
        default: alfred_json
        allowed: [text, json, alfred_json]
